[project]
name = "arxiv-digest-agent"
version = "0.1.0"
description = "Autonomous arXiv paper digest & QA agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "typer==0.27.2",
    "rich==15.0.0",
    "arxiv==4.0.1",
    "pymupdf==1.28.2",
    "pdfplumber==0.11.10",
    "sentence-transformers==6.1.0",
    "chromadb==1.5.9",
    "google-genai==2.24.0",
    "groq==1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-mock==3.15.1",
    "ruff==0.16.8",
]

[project.scripts]
arxiv-agent = "arxiv_agent.cli:app"

[tool.pytest.ini_options]
markers = [
    "unit: fast, fully-mocked/fake-injected tests with no network or real model calls (the default for most of this suite; unmarked tests are implicitly unit)",
    "integration: exercises several real components together, e.g. a real PDF fixture through the actual parser",
    "network: touches a real network endpoint, or loads a real ML model that downloads on first run (e.g. sentence-transformers)",
]

[tool.ruff.lint.flake8-bugbear]
# `typer.Option(...)`/`typer.Argument(...)` as a parameter default is Typer's
# documented CLI pattern (cli.py), not the mutable-default footgun B008 exists
# to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_agent"]
